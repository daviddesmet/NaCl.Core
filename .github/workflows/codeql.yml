name: CodeQL

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '30 5 * * 1' # Weekly, Mondays 05:30 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: 'Install .NET SDK'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      - name: 'Initialize CodeQL'
        uses: github/codeql-action/init@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3.36.3
        with:
          languages: csharp
          queries: security-and-quality
      - name: 'Build'
        run: dotnet build src/NaCl.Core/NaCl.Core.csproj --configuration Release
      - name: 'Perform CodeQL Analysis'
        uses: github/codeql-action/analyze@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3.36.3
        with:
          category: '/language:csharp'
